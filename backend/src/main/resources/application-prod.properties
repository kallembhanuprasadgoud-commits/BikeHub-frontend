# ==========================================
# BikeHub Production Configuration Profile
# ==========================================
server.port=${PORT:8080}

# ---------- Database (MySQL) ----------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bikehub_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bikehub_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bikehub_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- JWT Security ----------
app.jwt.secret=${JWT_SECRET:BikeHubSuperSecretSecurityKey2026WithAtLeast256BitsLength!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:5173,*}

# ---------- File Upload ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# ---------- Payment Gateway (Razorpay) ----------
payment.key-id=${RAZORPAY_KEY_ID:rzp_test_bikehub2026}
payment.key-secret=${RAZORPAY_KEY_SECRET:rzp_secret_dummy}

# ---------- AI Python Microservice ----------
ai.service.url=${AI_SERVICE_URL:http://bikehub-ai:5000}
