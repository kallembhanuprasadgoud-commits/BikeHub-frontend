# ---------- Server ----------
server.port=8080

# ---------- Database (MySQL) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/bikehub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=project123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- JWT ----------
# Minimum 256-bit (32 byte) HMAC key
app.jwt.secret=BikeHubSuperSecretSecurityKey2026WithAtLeast256BitsLength!
app.jwt.expiration-ms=86400000

# ---------- CORS ----------
app.cors.allowed-origins=http://localhost:5173

# ---------- File upload ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# ---------- Cloudinary (image storage) ----------
cloudinary.cloud-name=CHANGE_ME
cloudinary.api-key=CHANGE_ME
cloudinary.api-secret=CHANGE_ME

# ---------- Payment gateway (Razorpay test mode) ----------
payment.key-id=CHANGE_ME
payment.key-secret=CHANGE_ME

# ---------- AI service (optional Python microservice) ----------
ai.service.url=http://localhost:5000
